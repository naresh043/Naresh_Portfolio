<svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle
    cx="70"
    cy="70"
    r="55"
    stroke="#111"
    stroke-width="12"
    fill="none"
  />

  <!-- Animated progress circle -->
  <circle
    cx="70"
    cy="70"
    r="55"
    stroke="#68A063"
    stroke-width="12"
    fill="none"
    stroke-dasharray="345"
    stroke-dashoffset="35"
    filter="url(#glow)"
  >
    <animate
      attributeName="stroke-dashoffset"
      from="345"
      to="35"
      dur="2s"
      fill="freeze"
    />
  </circle>

  <!-- Percentage -->
  <text
    x="70"
    y="65"
    text-anchor="middle"
    fill="white"
    font-size="20"
    font-weight="bold"
  >
    85%
  </text>

  <!-- Skill name -->
  <text
    x="70"
    y="88"
    text-anchor="middle"
    fill="#68A063"
    font-size="14"
  >
    Node.js
  </text>
</svg>